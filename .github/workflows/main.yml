name: 测试工作流
on: [push]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - id: test
            uses: actions-helper/test/test-action@v1
            with:
              input-test: '输入成功'
          - run: echo "$OUTPUT_TEST"
            shell: bash
            env:
              OUTPUT_TEST: ${{steps.test.outputs.output-test}}